# Local development stack: infra only (postgres, redis, minio), exposed
# to the host on their default ports for local debugging. Run api/worker
# natively (`make run` / `make worker`) against this, not in Docker — a
# container rebuild-per-code-change loop is worse DX than the Go toolchain
# running directly, and it avoids api/worker fighting over ports with a
# containerized copy of themselves. Building/running api and worker as
# containers is exercised by deployments/docker/*.Dockerfile directly
# (CI) and by docker-compose.prod.yml (the VPS) instead.
name: fashion-store-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: fashion_store
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d fashion_store"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
  miniodata:
