# Reverse proxy for the production VPS (see docs/system-design.md §1).
# Terminates TLS, forwards /api/* to the api container, and serves the
# ACME HTTP-01 challenge for certbot renewal. Replace example.com and run
# certbot once to obtain the initial certificate before this config's
# `listen 443` block will work — until then, comment it out and serve
# plain HTTP so certbot's webroot challenge can succeed.

upstream api_upstream {
    server api:8080;
}

server {
    listen 80;
    server_name example.com www.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        proxy_pass http://api_upstream;
    }
}
